server:
  port: 8080

spring:
  application:
    name: mealmate
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mealmate?createDatabaseIfNotExist=true}
    username: ${DB_USER:mealmate}
    password: ${DB_PASSWORD:mealmate}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

mealmate:
  jwt:
    # Must be at least 32 characters. Always override in production.
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-of-32-plus-chars}
    ttl-minutes: 120
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: usd
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@mealmate.dev}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health

---
# Run without MySQL: SPRING_PROFILES_ACTIVE=dev
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:mealmate;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
mealmate:
  admin:
    password: ${ADMIN_PASSWORD:admin12345}
